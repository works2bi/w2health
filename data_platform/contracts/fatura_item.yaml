entity: fatura_item
version: 1
grain: "1 linha por item de um documento de cobrança"
primary_key: [tenant_id, id_fatura_item]
business_keys:
  - [tenant_id, numero_documento, numero_item]
load_strategy: SNAPSHOT_DOCUMENTO
watermark_column: source_updated_at
updated_at_column: source_updated_at
deduplication_strategy: "business_key"
fields:
  - name: tenant_id
    type: string
    nullable: false
    required_for: [ALL]
    classification: internal
    description: "Cliente."
    example: "operadora-alfa"
    typical_source: "constante"
    transformation: "literal"
    quality_rules: [tenant_id_ausente]
  - name: id_fatura_item
    type: bigint
    nullable: false
    required_for: [financial]
    classification: internal
    description: "Surrogate key."
    example: 50001
    typical_source: "gerado"
    transformation: "surrogate"
    quality_rules: []
  - name: id_fatura
    type: bigint
    nullable: false
    required_for: [financial]
    classification: internal
    description: "FK do documento."
    example: 9001
    typical_source: "faturamento"
    transformation: "lookup numero_documento"
    quality_rules: [fk_inexistente_numero_documento]
  - name: numero_item
    type: string
    nullable: false
    required_for: [financial]
    classification: operational
    description: "Número do item no documento."
    example: "1"
    typical_source: "faturamento"
    transformation: "-"
    quality_rules: []
  - name: natureza
    type: string
    nullable: false
    required_for: []
    classification: operational
    description: "mensalidade | coparticipacao | taxa | ajuste | retroativo | desconto | acrescimo | outro. Vazio = mensalidade."
    example: "mensalidade"
    typical_source: "faturamento"
    transformation: "normalizar"
    quality_rules: []
  - name: id_contrato
    type: bigint
    nullable: true
    required_for: []
    classification: internal
    description: "Contrato do item, quando a origem detalha."
    example: 45
    typical_source: "faturamento"
    transformation: "lookup"
    quality_rules: [fk_inexistente_contrato_codigo]
  - name: id_plano
    type: bigint
    nullable: true
    required_for: []
    classification: internal
    description: "Plano do item, quando detalhado (par do contrato)."
    example: 12
    typical_source: "faturamento"
    transformation: "lookup"
    quality_rules: [plano_fora_do_contrato]
  - name: competencia_referencia
    type: date
    nullable: true
    required_for: []
    classification: internal
    description: "Competência de cobertura do item."
    example: "2026-04-01"
    typical_source: "faturamento"
    transformation: "-"
    quality_rules: []
  - name: quantidade_beneficiarios
    type: int
    nullable: true
    required_for: []
    classification: operational
    description: "Vidas cobradas no item."
    example: 12
    typical_source: "faturamento"
    transformation: "-"
    quality_rules: []
  - name: valor
    type: numeric
    nullable: false
    required_for: [financial]
    classification: operational
    description: "Valor do item. Negativo só em desconto/ajuste/retroativo."
    example: 3600.0
    typical_source: "faturamento"
    transformation: "-"
    quality_rules: [valor_negativo]
metadata_fields: [tenant_id, source_system, source_entity, source_record_id, ingestion_id,
                  ingestion_timestamp, source_updated_at, reference_date, raw_payload_hash]
notes: >
  OPCIONAL. Itens de um documento são substituídos a cada carga do documento (snapshot por
  documento). Σ itens = valor_total do documento (reconciliação `fatura_itens_vs_total`). Em
  documento de EMPRESA, item com contrato precisa ser de contrato associado à empresa na
  competência (`empresa_vs_contratos_relacionados`).
