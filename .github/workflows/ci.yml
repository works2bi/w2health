# CI — W2Health. Nenhum segredo real: chaves de teste são geradas na hora pelos próprios
# testes (conftest) e o banco é um serviço efêmero do runner.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: w2health
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: w2health
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U w2health" --health-interval 5s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://w2health:ci-only-not-a-secret@127.0.0.1:5432/w2health
      DATABASE_ADMIN_URL: postgresql+psycopg://w2health:ci-only-not-a-secret@127.0.0.1:5432/w2health
      APP_DB_PASSWORD: ci-app-role
      PIPELINE_DB_PASSWORD: ci-pipeline-role
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Dependências (lock)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests
      - name: Migrations do zero + drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Downgrade/upgrade da migration mais recente
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: Migrations com dono sem privilégio e papéis provisionados (deploy VPS, docs/DEPLOY_VPS.md)
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          psql() { command psql -h 127.0.0.1 -U w2health -d w2health -v ON_ERROR_STOP=1 "$@"; }
          for r in vps_owner vps_app vps_pipeline; do
            psql -c "CREATE ROLE $r LOGIN PASSWORD 'ci-$r' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
          done
          psql -c "CREATE DATABASE w2health_vps OWNER vps_owner"
          psql -c "CREATE DATABASE w2health_vps_neg OWNER vps_owner"
          unset APP_DB_PASSWORD PIPELINE_DB_PASSWORD
          export DB_ROLES_PROVISIONED=true APP_DB_ROLE=vps_app PIPELINE_DB_ROLE=vps_pipeline
          DATABASE_ADMIN_URL=postgresql+psycopg://vps_owner:ci-vps_owner@127.0.0.1:5432/w2health_vps             uv run alembic upgrade head
          DATABASE_ADMIN_URL=postgresql+psycopg://vps_owner:ci-vps_owner@127.0.0.1:5432/w2health_vps             uv run python -m app.saas.cli sync-catalog
          # papel de runtime com BYPASSRLS: a migration recusa
          psql -c "ALTER ROLE vps_app BYPASSRLS"
          if DATABASE_ADMIN_URL=postgresql+psycopg://vps_owner:ci-vps_owner@127.0.0.1:5432/w2health_vps_neg               uv run alembic upgrade head; then
            echo "migration deveria recusar papel com BYPASSRLS"; exit 1
          fi
          psql -c "ALTER ROLE vps_app NOBYPASSRLS"
      - name: Testes (inclui segurança, isolamento, worker, object storage local)
        run: uv run pytest -q -p no:cacheprovider
      - name: Vulnerabilidades conhecidas (dependências travadas)
        run: uvx pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build estático (deploy VPS — nginx, sem Node em runtime)
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_BASE_URL: /api
        run: |
          npm run build
          for r in beneficiarios contratos prestadores admin/tenants; do test -f "out/$r/_/index.html"; done
      - name: Vulnerabilidades — dependências de produção (bloqueante)
        run: npm audit --omit=dev --audit-level=low
      - name: Vulnerabilidades — ferramentas de build (informativo; ver docs/DEPENDENCY_SECURITY.md)
        run: npm audit || true

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção do backend (API + worker)
        run: docker build -f backend/Dockerfile -t w2h-backend:ci .
      - name: Build da imagem do frontend
        run: docker build -t w2h-frontend:ci frontend
      - name: Imagens rodam como não-root e sem ferramentas de desenvolvimento
        run: |
          test "$(docker run --rm --entrypoint id w2h-backend:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint id w2h-frontend:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh w2h-backend:ci -c "pip list 2>/dev/null | grep -iE '^(pytest|ruff) '"
          ! docker run --rm --entrypoint sh w2h-backend:ci -c "test -d /app/tests"
      - name: Configuração de produção insegura não sobe (fail-closed)
        run: |
          ! docker run --rm -e ENVIRONMENT=production w2h-backend:ci python -m app.worker run
